
<div class="otp-page">
  <div class="otp-card">

    <div class="brand">
      <div class="brand-icon">₹</div>
      <h1>LoanMatrix</h1>
      <p>Secure email verification</p>
    </div>

    <div class="otp-icon">✉</div>

    <h2>Verify your email</h2>

    <p class="description">
      Enter the six-digit verification code sent to your email address.
    </p>

    <form (ngSubmit)="verifyOtp()" #otpForm="ngForm">

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="otp">Verification code</label>

        <input
          type="text"
          id="otp"
          name="otp"
          [(ngModel)]="otp"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          required
          placeholder="Enter 6-digit OTP">
      </div>

      <button
        type="submit"
        class="verify-button"
        [disabled]="loading || otpForm.invalid">

        {{ loading ? 'Verifying...' : 'Verify email' }}
      </button>

    </form>

    <p class="back-text">
      Already verified?
      <a routerLink="/login">Back to login</a>
    </p>

  </div>
</div>
