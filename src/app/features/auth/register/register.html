
<div class="register-page">
  <div class="register-card">

    <div class="brand">
      <div class="brand-icon">₹</div>
      <h1>LoanMatrix</h1>
      <p>Create your customer account</p>
    </div>

    <h2>Customer Registration</h2>
    <p class="subtitle">Enter your details to get started.</p>

    <form (ngSubmit)="registerCustomer()" #registerForm="ngForm">

      <div class="form-grid">

        <div class="form-group">
          <label for="firstName">First name *</label>
          <input
            id="firstName"
            name="firstName"
            [(ngModel)]="firstName"
            required
            placeholder="First name">
        </div>

        <div class="form-group">
          <label for="lastName">Last name *</label>
          <input
            id="lastName"
            name="lastName"
            [(ngModel)]="lastName"
            required
            placeholder="Last name">
        </div>

        <div class="form-group full-width">
          <label for="email">Email address *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            minlength="8"
            required
            placeholder="At least 8 characters">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            placeholder="Re-enter password">
        </div>

        <div class="form-group">
          <label for="mobileNo">Mobile number *</label>
          <input
            id="mobileNo"
            name="mobileNo"
            [(ngModel)]="mobileNo"
            maxlength="10"
            inputmode="numeric"
            required
            placeholder="10-digit mobile number">
        </div>

        <div class="form-group">
          <label for="dateOfBirth">Date of birth *</label>
          <input
            type="date"
            id="dateOfBirth"
            name="dateOfBirth"
            [(ngModel)]="dateOfBirth"
            [max]="''"
            required>
        </div>

        <div class="form-group">
          <label for="aadhaarNo">Aadhaar number *</label>
          <input
            id="aadhaarNo"
            name="aadhaarNo"
            [(ngModel)]="aadhaarNo"
            maxlength="12"
            inputmode="numeric"
            required
            placeholder="12-digit Aadhaar number">
        </div>

        <div class="form-group">
          <label for="panCard">PAN number *</label>
          <input
            id="panCard"
            name="panCard"
            [(ngModel)]="panCard"
            maxlength="10"
            (ngModelChange)="panCard = $event.toUpperCase()"
            required
            placeholder="ABCDE1234F">
        </div>

        <div class="form-group">
          <label for="employmentType">Employment type *</label>
          <select
            id="employmentType"
            name="employmentType"
            [(ngModel)]="employmentType"
            required>

            <option value="" disabled>Select employment type</option>
            <option value="Private">Private</option>
            <option value="Govt">Government</option>
            <option value="Self-employed">Self-employed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="monthlyIncome">Monthly income (₹) *</label>
          <input
            type="number"
            id="monthlyIncome"
            name="monthlyIncome"
            [(ngModel)]="monthlyIncome"
            min="1"
            required
            placeholder="Monthly income">
        </div>

        <div class="form-group">
          <label for="monthlyInvestmentAmount">
            Monthly investment (₹)
          </label>
          <input
            type="number"
            id="monthlyInvestmentAmount"
            name="monthlyInvestmentAmount"
            [(ngModel)]="monthlyInvestmentAmount"
            min="0"
            placeholder="Optional">
        </div>

      </div>

      <button
        type="submit"
        class="register-button"
        [disabled]="loading || registerForm.invalid">

        {{ loading ? 'Creating account...' : 'Register' }}
      </button>

    </form>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
