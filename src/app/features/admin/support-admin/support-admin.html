
<h2>Admin Support Ticket Management</h2>

<button type="button" (click)="loadTickets()">Refresh Tickets</button>

<br /><br />

<table border="1" cellpadding="8" cellspacing="0" width="100%">
  <thead>
    <tr>
      <th>Ticket ID</th>
      <th>Customer ID</th>
      <th>Subject</th>
      <th>Description</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let ticket of tickets">
      <td>{{ ticket.id }}</td>
      <td>{{ ticket.customerId }}</td>
      <td>{{ ticket.subject }}</td>
      <td>{{ ticket.description }}</td>

      <td>
        <select [(ngModel)]="ticket.status" [name]="'status-' + ticket.id">
          <option *ngFor="let status of statuses" [value]="status">
            {{ status }}
          </option>
        </select>
      </td>

      <td>
        <button type="button" (click)="updateStatus(ticket)">
          Update Status
        </button>
      </td>
    </tr>

    <tr *ngIf="tickets.length === 0">
      <td colspan="6">No support tickets found.</td>
    </tr>
  </tbody>
</table>
